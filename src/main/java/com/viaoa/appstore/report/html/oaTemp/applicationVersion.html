<!-- Generated by OABuilder -->

<html>
    <head>
        <BASE HREF='classpath://com.viaoa.appstore.report.html'>
        <link rel='stylesheet' href='main.css' type='text/css'>
    </head>
<body>
    <div class='background'>
        <table class="outer" width="100%">
            <tr>
                <td>
                    <table width="100%">
                        <tr>
                            <td width="20">
                                <table class="form">
                                    <tr>
                                        <th width="20"><nobr>Application Type Name</nobr></th>
                                        <td><%=applicationType.name, '40L.'%></td>
                                    </tr>
                                </table>
                            </td>
                        </tr>
                        <tr><td>&nbsp;</td></tr>
                        <tr>
                            <td>
                                <table class="list" width="100%">
                                    <tr>
                                        <th colspan="3">VersionFiles</th>
                                    </tr>
                                    <tr>
                                        <th style="width: 20px; text-align: right">#</th>
                                        <th style="width: 75px; text-align: right"><nobr>Type</nobr></th>
                                        <th width="100%" style="text-align: left"><nobr>File Path</nobr></th>
                                    </tr>
                                    <%=foreach versionFiles%>
                                    <tr>
                                        <td style="text-align: right"><%=#counter versionFiles, '4R,'%></td>
                                        <td style="text-align: right"><nobr><%=type, '15L.'%></nobr></td>
                                        <td style="text-align: left"><nobr><%=filePath, '120L.'%></nobr></td>
                                    </tr>
                                    <%=end%>
                                </table>
                            </td>
                        </tr>
                    </table>
                </td>
            </tr>
        </table>
    </div>
</body>
</html>
