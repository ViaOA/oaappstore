<!-- Generated by OABuilder -->

<html>
    <head>
        <BASE HREF='classpath://com.viaoa.appstore.report.html'>
        <link rel='stylesheet' href='main.css' type='text/css'>
    </head>
<body>
    <div class='background'>
        <table class="outer" width="100%">
            <tr>
                <td>
                    <table class="list" width="100%">
                        <tr>
                            <th style="width: 20px; text-align: right">#</th>
                            <th width="16%" style="text-align: left"><nobr>Environment</nobr></th>
                            <th width="31%" style="text-align: left"><nobr>Name</nobr></th>
                            <th width="29%" style="text-align: left"><nobr>Server</nobr></th>
                            <th width="22%" style="text-align: left"><nobr>Application Type Name</nobr></th>
                            <th style="width: 30px; text-align: right"><nobr>Http</nobr></th>
                        </tr>
                        <%=foreach%>
                        <tr>
                            <td style="text-align: right"><%=#counter, '4R,'%></td>
                            <td style="text-align: left"><nobr><%=server.environment.name, '35L.'%></nobr></td>
                            <td style="text-align: left"><nobr><%=name, '55L.'%></nobr></td>
                            <td style="text-align: left"><nobr><%=server.name, '55L.'%></nobr></td>
                            <td style="text-align: left"><nobr><%=applicationType.name, '40L.'%></nobr></td>
                            <td style="text-align: right"><nobr><%=httpPort, '#'%></nobr></td>
                        </tr>
                        <%=end%>
                    </table>
                </td>
            </tr>
        </table>
    </div>
</body>
</html>
