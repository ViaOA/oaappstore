<!-- Generated by OABuilder -->

<html>
    <head>
        <BASE HREF='classpath://com.viaoa.appstore.report.html'>
        <link rel='stylesheet' href='main.css' type='text/css'>
    </head>
<body>
    <div class='background'>
        <table class="outer" width="100%">
            <tr>
                <td>
                    <table class="list" width="100%">
                        <tr>
                            <th style="width: 20px; text-align: right">#</th>
                            <th width="18%" style="text-align: left"><nobr>Env</nobr></th>
                            <th width="22%" style="text-align: left"><nobr>Server</nobr></th>
                            <th width="36%" style="text-align: left"><nobr>App Name</nobr></th>
                            <th width="23%" style="text-align: left"><nobr>App Type</nobr></th>
                            <th style="width: 30px; text-align: right"><nobr>Port</nobr></th>
                        </tr>
                        <%=foreach%>
                        <tr>
                            <td style="text-align: right"><%=#counter, '4R,'%></td>
                            <td style="text-align: left"><nobr><%=serverApplication.server.environment.name, '35L.'%></nobr></td>
                            <td style="text-align: left"><nobr><%=serverApplication.server.calcName, '45L.'%></nobr></td>
                            <td style="text-align: left"><nobr><%=calcName, '40L.'%></nobr></td>
                            <td style="text-align: left"><nobr><%=serverApplication.applicationType.name, '40L.'%></nobr></td>
                            <td style="text-align: right"><nobr><%=serverApplication.calcClientPort, '###'%></nobr></td>
                        </tr>
                        <%=end%>
                    </table>
                </td>
            </tr>
        </table>
    </div>
</body>
</html>
