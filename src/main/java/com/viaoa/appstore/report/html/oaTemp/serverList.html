<!-- Generated by OABuilder -->

<html>
    <head>
        <BASE HREF='classpath://com.viaoa.appstore.report.html'>
        <link rel='stylesheet' href='main.css' type='text/css'>
    </head>
<body>
    <div class='background'>
        <table class="outer" width="100%">
            <tr>
                <td>
                    <table class="list" width="100%">
                        <tr>
                            <th style="width: 20px; text-align: right">#</th>
                            <th width="28%" style="text-align: left"><nobr>Name</nobr></th>
                            <th width="20%" style="text-align: left"><nobr>Host</nobr></th>
                            <th style="width: 100px; text-align: left"><nobr>IP Address</nobr></th>
                            <th width="52%" style="text-align: left"><nobr>Applicaitons</nobr></th>
                        </tr>
                        <%=foreach%>
                        <tr>
                            <td style="text-align: right"><%=#counter, '4R,'%></td>
                            <td style="text-align: left"><nobr><%=name, '55L.'%></nobr></td>
                            <td style="text-align: left"><nobr><%=host, '35L.'%></nobr></td>
                            <td style="text-align: left"><nobr><%=ipAddress, '20L.'%></nobr></td>
                            <td style="text-align: left"><nobr><%=serverApplications.calcName, '80L.'%></nobr></td>
                        </tr>
                        <%=end%>
                    </table>
                </td>
            </tr>
        </table>
    </div>
</body>
</html>
