<!-- Generated by OABuilder -->

<html>
    <head>
        <BASE HREF='classpath://com.viaoa.appstore.report.html'>
        <link rel='stylesheet' href='main.css' type='text/css'>
    </head>
<body>
    <div class='background'>
        <table class="outer" width="100%">
            <tr>
                <td>
                    <table class="list" width="100%">
                        <tr>
                            <th style="width: 20px; text-align: right">#</th>
                            <th style="width: 30px; text-align: right"><nobr>Id</nobr></th>
                            <th style="width: 40px; text-align: left"><nobr>Abbrev</nobr></th>
                            <th width="100%" style="text-align: left"><nobr>Name</nobr></th>
                            <th style="width: 20px; text-align: right"><nobr>Port</nobr></th>
                            <th style="width: 30px; text-align: right"><nobr>HTTP</nobr></th>
                            <th style="width: 20px; text-align: right"><nobr>HTTPS</nobr></th>
                        </tr>
                        <%=foreach%>
                        <tr>
                            <td style="text-align: right"><%=#counter, '4R,'%></td>
                            <td style="text-align: right"><nobr><%=id, '6R,'%></nobr></td>
                            <td style="text-align: left"><nobr><%=abbrevName, '6L.'%></nobr></td>
                            <td style="text-align: left"><nobr><%=name, '40L.'%></nobr></td>
                            <td style="text-align: right"><nobr><%=clientPort, '#'%></nobr></td>
                            <td style="text-align: right"><nobr><%=httpPort, '#'%></nobr></td>
                            <td style="text-align: right"><nobr><%=httpsPort, '#'%></nobr></td>
                        </tr>
                        <%=end%>
                    </table>
                </td>
            </tr>
        </table>
    </div>
</body>
</html>
